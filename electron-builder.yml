# electron-builder 打包配置（Task 9：一份代码打 Windows 安装包）。
#
# 只挑了三块产物进包（dist/**、dist-desktop/**、package.json）—— 后端已经整体内联在
# dist-desktop/main.js 里，dist/web 是静态资源，其余源码 / 测试 / 工具都不进 asar。
#
# 两个和「更新通道」直接相关的字段，别随手改：
# - publish 必须是真仓库（528085390/pinfolio），electron-builder 据此生成 <resources>/app-update.yml；
#   少了它，装出来的包 updater 会一直报「未启用」。
# - nsis.artifactName 决定 release/ 里的文件名，latest.yml 的 path 必须和它逐字一致，
#   否则 Task 10 的真实更新流转会 404（见 release/latest.yml）。
appId: com.pinfolio.desktop
productName: pinfolio

# 发布者身份（Task 9 收尾 P2）。两处各管一半，别只改一处：
# - exe 版本资源的 CompanyName 取自 package.json 的 author（appInfo.companyName = author.name），
#   没有 author 时 builder 不覆盖 Electron 自带的 "GitHub, Inc."，控制面板「发布者」也是空的；
# - LegalCopyright 取自这里的 copyright，NSIS 还会把 COMPANY_NAME 写进卸载项的 Publisher。
# 年份写死 2026，不用 builder 默认的「当年」拼接 —— 否则跨年后重打同一份包，版权行会自己变。
copyright: "Copyright © 2026 pinfolio contributors"

directories:
  output: release
  buildResources: desktop/assets

asar: true

files:
  - dist/**
  - dist-desktop/**
  - package.json

# 托盘图标（Task 9 收尾 P3）：desktop/tray.ts 的第一个候选就是 <resources>/icon.ico，
# 但 files 白名单里没有 desktop/assets，打包态永远落到内置兜底 PNG。这里把它单独放进
# resources/（asar 外面），tray.ts 的优先级一个字都不用改 —— 图标路径只有这两处要对齐。
extraResources:
  - from: desktop/assets/icon.ico
    to: icon.ico

# package.json 里 main 已经是 dist-desktop/main.js，这里是第二道保险（asar 里根目录的 package.json
# 是 Electron 启动时唯一读的那份，产物路径变了也不会白打一次包）
extraMetadata:
  main: dist-desktop/main.js

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: desktop/assets/icon.ico

nsis:
  oneClick: false # 向导式安装，不是一键装
  perMachine: false # 装到当前用户（%LOCALAPPDATA%\Programs），不需要管理员
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false # 卸载保留 %APPDATA%\pinfolio（便签 / 附件 / 配置都在里面）
  artifactName: pinfolio-Setup-${version}.${ext}

publish:
  - provider: github
    owner: 528085390
    repo: pinfolio
