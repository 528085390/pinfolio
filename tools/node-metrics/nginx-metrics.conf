
    # ── 服务器指标上报（2026-10-22 加）────────────────────────────────────────
    # 6 台机的 node-metrics.timer 每 5 分钟 PUT 一份 JSON 到这里；
    # nginx dav 模块直接落盘 —— 不新增进程、不新增端口、不需要任何后端。
    # 本机 pinfolio 再从下面的 GET 端点按 host 拉走入库（历史曲线在 SQLite 里）。
    # 路径里的 token 就是口令：换 token = 改这两行 + 6 台机的 /etc/node-metrics.conf。
    location ^~ /metrics-ingest/<TOKEN>/ {
        alias /var/www/metrics/;
        dav_methods PUT;
        create_full_put_path on;
        dav_access user:rw group:r all:r;
        client_max_body_size 64k;
        limit_except PUT { deny all; }
        access_log off;
    }

    location ^~ /metrics/<TOKEN>/ {
        alias /var/www/metrics/;
        autoindex off;
        default_type application/json;
        add_header Cache-Control "no-store";
    }
