<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pinfolio</title>
    <meta name="description" content="Self-hosted notes, asset inventory, uptime dashboard and read-only inbox in one Node process and one SQLite file." />
    <!-- 分享出去的链接（Discord / Telegram / Slack / Reddit / X）靠下面这组标签出预览卡。
         __PINBOARD_ORIGIN__ 由 server/static.ts 按访客实际访问的域名替换——自建的人域名各不相同，构建时写死没用。 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="pinfolio" />
    <meta property="og:title" content="pinfolio — notes, assets, uptime, one SQLite file" />
    <meta property="og:description" content="Self-hosted notes, asset inventory, uptime dashboard and read-only inbox in one Node process and one SQLite file." />
    <meta property="og:url" content="__PINBOARD_ORIGIN__/" />
    <meta property="og:image" content="__PINBOARD_ORIGIN__/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="__PINBOARD_ORIGIN__/og.png" />
    <!-- 加到主屏幕后按独立窗口打开（没有地址栏）：iOS 认 apple-mobile-web-app-capable，其余认 manifest 的 display -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="pinfolio" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#fffdf8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1e1b16" media="(prefers-color-scheme: dark)" />
    <!-- 相对路径：同一份构建既能挂根路径，也能挂反代子路径 -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23b45309'/%3E%3Cpath d='M9 10h14M9 16h14M9 22h9' stroke='%23fff8ee' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
