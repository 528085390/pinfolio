name: Desktop Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Publish Windows Installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test:unit

      - name: Build and package desktop installer
        run: |
          pnpm build:icon
          pnpm build
          pnpm build:desktop:main
          pnpm build:desktop:vendor
          npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinfolio-desktop-windows
          path: |
            release/pinfolio-Setup-*.exe
            release/pinfolio-Setup-*.exe.blockmap
            release/latest.yml
          if-no-files-found: warn
